name: Check health of platform scripts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/healthcheck-platform-scripts.yml"
      - "SignallingWebServer/**"

permissions:
  contents: read

jobs:
  run-script-linux:
    if: github.repository == 'EpicGames/PixelStreamingInfrastructure'
    runs-on: {group: ci-untrusted, labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Launch and query signalling server using the REST API
        working-directory: SignallingWebServer
        run: |
          ./platform_scripts/bash/start.sh -- --rest_api --player_port 999 &
          curl --retry 10 --retry-delay 20 --retry-connrefused http://localhost:999/api/status

  run-script-macos:
    if: github.repository == 'EpicGames/PixelStreamingInfrastructure'
    runs-on: {group: ci-macos-ephemeral, labels: [self-hosted, macOS, ARM64, ram-ge-40g, site-lucid-lab]}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Launch and query signalling server using the REST API
        working-directory: SignallingWebServer
        run: |
          ./platform_scripts/bash/start.sh -- --rest_api --player_port 999 &
          curl --retry 10 --retry-delay 20 --retry-connrefused http://localhost:999/api/status

  run-script-windows:
    if: github.repository == 'EpicGames/PixelStreamingInfrastructure'
    runs-on: {group: ci-windows-ephemeral, labels: [self-hosted, Windows, X64, ram-ge-8g, disk-ge-100g]}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Launch and query signalling server using the REST API
        working-directory: SignallingWebServer
        run: |
          Start-Process -NoNewWindow ".\platform_scripts\cmd\start.bat" -ArgumentList "--", "--rest_api","--player_port 999"
          curl --retry 10 --retry-delay 20 --retry-connrefused http://localhost:999/api/status
