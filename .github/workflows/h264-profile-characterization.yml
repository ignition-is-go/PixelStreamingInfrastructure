name: Characterize H264 profiles offline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/h264-profile-characterization.yml'
      - 'Extras/FrontendTests/h264-profile-*.cjs'
      - 'Extras/FrontendTests/package.json'
      - 'Extras/mediasoup-sdp-bridge/**'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: h264-profile-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser-mode: portable
          - os: macos-latest
            browser-mode: shipping
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: NODE_VERSION
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install software encoder and portable browsers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chromium firefox webkit
        working-directory: Extras/FrontendTests
      - name: Install shipping browsers and software encoder
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg geckodriver
          brew install --cask google-chrome firefox
          sudo safaridriver --enable
      - name: Test lossless RTP packetization and packet-budget boundaries
        run: npm run test:h264:packetizer --workspace Extras/FrontendTests
      - name: Measure profiles and exercise actual browser decoding
        shell: bash
        env:
          H264_PROFILE_BROWSER_MODE: ${{ matrix.browser-mode }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          npm run characterize:h264:profiles --workspace Extras/FrontendTests | tee "$RUNNER_TEMP/h264-profile-bench.log"
      - name: Upload characterization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h264-profile-characterization-${{ matrix.browser-mode }}
          path: |
            ${{ runner.temp }}/h264-profile-bench.log
            ${{ runner.temp }}/h264-profile-bench-*/report.json
          retention-days: 14
