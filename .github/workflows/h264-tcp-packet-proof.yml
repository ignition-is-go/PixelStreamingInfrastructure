name: Prove larger H264 packets over TCP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/h264-tcp-packet-proof.yml'
      - 'Extras/FrontendTests/build-h264-tcp-worker.cjs'
      - 'Extras/FrontendTests/h264-tcp-bench.cjs'
      - 'Extras/FrontendTests/h264-profile-probe.cjs'
      - 'Extras/FrontendTests/h264-profile-rtp.cjs'
      - 'Extras/FrontendTests/h264-profile-shipping.cjs'

permissions:
  contents: read

concurrency:
  group: h264-tcp-packet-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: NODE_VERSION
          cache: npm
      - run: npm ci
      - name: Install shipping browsers and software encoder
        run: |
          brew install ffmpeg geckodriver
          brew install --cask google-chrome firefox
          sudo safaridriver --enable
      - name: Build isolated worker with larger RTP capacity and unchanged RTCP budget
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          node Extras/FrontendTests/build-h264-tcp-worker.cjs | tee "$RUNNER_TEMP/h264-tcp-worker-build.log"
      - name: Require identical encoded bytes to decode with larger TCP packets
        env:
          TMPDIR: ${{ runner.temp }}
          H264_PROFILE_BROWSER_MODE: shipping
        run: |
          set -o pipefail
          node Extras/FrontendTests/h264-tcp-bench.cjs | tee "$RUNNER_TEMP/h264-tcp-proof.log"
      - name: Upload proof and build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: h264-tcp-packet-proof
          path: |
            ${{ runner.temp }}/h264-tcp-worker-build.log
            ${{ runner.temp }}/h264-tcp-proof.log
            ${{ runner.temp }}/h264-tcp-bench-*/report.json
          retention-days: 14
