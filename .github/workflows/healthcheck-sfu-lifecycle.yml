name: Check SFU lifecycle races

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/healthcheck-sfu-lifecycle.yml'
            - 'SFU/**'
            - 'Extras/FrontendTests/h264-compat.config.ts'
            - 'Extras/FrontendTests/tests/h264-baseline-compat.spec.ts'
            - 'Extras/FrontendTests/tests/h264-firefox-release.mjs'
            - 'vendor/**'
            - 'scripts/update-protocol-types.mjs'
            - 'package-lock.json'

permissions:
    contents: read

jobs:
    test-sfu:
        runs-on: {group: ci-untrusted, labels: [self-hosted, Linux, X64, ram-ge-16g, disk-ge-100g]}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: NODE_VERSION
                  cache: npm

            - name: Verify reporting contract archive
              run: node scripts/update-protocol-types.mjs --check

            - name: Install locked dependencies
              run: npm ci

            - name: Test SFU lifecycle races
              run: npm test --workspace SFU

            - name: Install H.264 browser test engines
              run: npx playwright install --with-deps chromium firefox webkit
              working-directory: Extras/FrontendTests

            - name: Test H.264 negotiation in portable browser engines
              run: npm run test:h264
              working-directory: Extras/FrontendTests

    test-h264-platform-browsers:
        runs-on: {group: ci-macos-ephemeral, labels: [self-hosted, macOS, ARM64, ram-ge-40g, site-lucid-lab]}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: NODE_VERSION
                  cache: npm

            - name: Install browser negotiation test dependencies
              run: npm ci --workspace=Extras/FrontendTests

            - name: Install Firefox and WebKit
              run: npx playwright install firefox webkit
              working-directory: Extras/FrontendTests

            - name: Install shipping Firefox and WebDriver
              run: |
                  brew install --cask firefox
                  brew install geckodriver

            - name: Require H.264 negotiation in shipping Firefox
              run: npm run test:h264:firefox-release
              working-directory: Extras/FrontendTests

            - name: Require H.264 decoding in Safari's WebKit engine
              run: npx playwright test --config h264-compat.config.ts --project webkit
              working-directory: Extras/FrontendTests
              env:
                  REQUIRE_H264: '1'
