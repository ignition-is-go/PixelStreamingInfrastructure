name: Check SFU lifecycle races

on:
    workflow_dispatch:
    pull_request:
        paths:
            - '.github/workflows/healthcheck-sfu-lifecycle.yml'
            - 'SFU/**'

permissions:
    contents: read

jobs:
    test-sfu:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: NODE_VERSION
                  cache: npm

            - name: Install locked dependencies
              run: npm ci --workspace=SFU

            - name: Test SFU lifecycle races
              run: node --test SFU/tests/*.test.js
