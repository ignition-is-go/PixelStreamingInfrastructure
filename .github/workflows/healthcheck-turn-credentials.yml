name: TURN credential issuer
on:
    pull_request:
        paths:
            - 'Common/**'
            - 'Signalling/**'
            - 'SignallingWebServer/**'
            - 'package-lock.json'
            - 'vendor/**'
            - 'scripts/update-reporting-types.mjs'
            - '.github/workflows/healthcheck-turn-credentials.yml'
    workflow_dispatch:
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: NODE_VERSION
                  cache: npm
            - run: node scripts/update-reporting-types.mjs --check
            - run: npm ci --workspace Common --workspace Signalling --workspace SignallingWebServer --include-workspace-root --ignore-scripts
            - run: npm run build:cjs --workspace Common
            - run: npm test --workspace Signalling
            - run: npm test --workspace SignallingWebServer
